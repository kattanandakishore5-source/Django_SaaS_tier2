name: Django CI/CD Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Safe mock values for CI testing
  SECRET_KEY: django-insecure-ci-mock-key-replace-me-in-prod
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ci_db
  DB_USER: ci_user
  DB_PASSWORD: ci_password
  DB_HOST: localhost
  DB_PORT: 5432
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0
  STRIPE_PUBLIC_KEY: pk_test_mock
  STRIPE_SECRET_KEY: sk_test_mock
  STRIPE_WEBHOOK_SECRET: whsec_mock
  STRIPE_PRICE_BASIC: price_mock_basic
  STRIPE_PRICE_PRO: price_mock_pro

jobs:
  test-and-verify:
    name: Code Quality, Security, and Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit

    - name: Dependency Vulnerability Scanning
      run: |
        pip-audit -r requirements.txt --desc

    - name: Hardcoded Secrets Scanning
      run: |
        # Fail fast if hardcoded secrets are found (excluding .env.example)
        echo "Scanning for hardcoded secrets..."
        if grep -rE "sk_live_|whsec_|SECRET_KEY=" . --exclude=".env.example" --exclude=".github/workflows/ci.yml" --exclude-dir=".git" --exclude-dir="venv"; then
          echo "::error::CRITICAL: Hardcoded secrets found in repository!"
          exit 1
        fi
        echo "No hardcoded secrets found."

    - name: Django Pre-flight Checks (Deploy & Migrations)
      run: |
        python manage.py check --deploy
        python manage.py makemigrations --check --dry-run

    - name: Run Test Suite
      run: |
        python manage.py test

  docker-build:
    name: Verify Docker Production Build
    runs-on: ubuntu-latest
    needs: test-and-verify
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker compose build
