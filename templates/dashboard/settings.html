{% extends 'base.html' %}

{% block page_title %}Settings{% endblock %}

        <div class="space-y-6">
            <div class="flex justify-between items-center pb-6 border-b border-gray-200 dark:border-gray-700">

                    <h4 class="font-semibold">Email Notifications</h4>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Receive emails about your account activity</p>

                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <div class="flex justify-between items-center pb-6 border-b border-gray-200 dark:border-gray-700">
                <div>
                    <h4 class="font-semibold">Weekly Digest</h4>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Get a summary of your activity every Monday</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" checked class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <div class="flex justify-between items-center">
                <div>
                    <h4 class="font-semibold">Login Alerts</h4>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Be notified of new login attempts</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" checked class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>

        </div>
