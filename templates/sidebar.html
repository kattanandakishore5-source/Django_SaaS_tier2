<!-- Sidebar -->
<aside class="w-64 bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col" 
       x-data="{ sidebarOpen: true }">
    
    <!-- Logo -->
    <div class="p-6 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold">AP</span>
            </div>
            <span class="font-bold text-lg">Admin Pro</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 overflow-y-auto">
        <ul class="space-y-2">
            <!-- Dashboard -->
            <li>
                <a href="/dashboard/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 
                   {% if request.resolver_match.url_name == 'dashboard_home' %}bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-semibold{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m2 3l2-3m2 3l2-3m2-4a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>

            <!-- Users (Owner/Manager only) -->
            {% if user.role in 'owner,manager' %}
            <li>
                <a href="/dashboard/users/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700
                   {% if request.resolver_match.url_name == 'dashboard_users' %}bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-semibold{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-2a6 6 0 0112 0v2zm0 0h6v-2a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span>Users</span>
                </a>
            </li>
            {% endif %}

            <!-- Audit Logs (Owner/Manager only) -->
            {% if user.role in 'owner,manager' %}
            <li>
                <a href="/dashboard/audit/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700
                   {% if request.resolver_match.url_name == 'dashboard_audit' %}bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-semibold{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span>Audit Logs</span>
                </a>
            </li>
            {% endif %}

            <!-- Divider -->
            <li class="my-4 border-t border-gray-200 dark:border-gray-700"></li>

            <!-- Profile -->
            <li>
                <a href="/dashboard/profile/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700
                   {% if request.resolver_match.url_name == 'dashboard_profile' %}bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-semibold{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span>Profile</span>
                </a>
            </li>

            <!-- API Keys -->
            <li>
                <a href="/dashboard/api-keys/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700
                   {% if request.resolver_match.url_name == 'dashboard_api_keys' %}bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-semibold{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                    <span>API Keys</span>
                </a>
            </li>

            <!-- Settings -->
            <li>
                <a href="/dashboard/settings/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700
                   {% if request.resolver_match.url_name == 'dashboard_settings' %}bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-semibold{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t border-gray-200 dark:border-gray-700 text-sm text-gray-600 dark:text-gray-400">
        <p>Django Admin Pro v1.0</p>
        <p class="text-xs mt-2">SaaS Dashboard Template</p>
    </div>
</aside>
