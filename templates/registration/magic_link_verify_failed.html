<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Link Invalid — Django Starter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-white">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-slate-900/80 p-8 shadow-xl text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-red-500/10 text-red-400">
                <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <h1 class="text-2xl font-bold">Magic Link Invalid</h1>
            <p class="mt-2 text-sm text-slate-400">{{ error|default:"This login link is invalid, already used, or expired." }}</p>

            <div class="mt-6 space-y-3">
                <a href="{% url 'magic_link_request' %}" class="block w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-500">Request New Magic Link</a>
                <a href="{% url 'login' %}" class="block w-full rounded-xl border border-white/10 bg-slate-800 px-4 py-3 font-semibold text-slate-300 transition hover:bg-slate-700">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
