<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 30px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f9fafb; padding: 30px; border: 1px solid #e5e7eb; }
        .footer { background: #f3f4f6; padding: 20px; text-align: center; font-size: 12px; color: #6b7280; border-radius: 0 0 8px 8px; }
        .code-box { background: #fef3c7; border: 2px solid #f59e0b; padding: 20px; border-radius: 6px; text-align: center; margin: 20px 0; }
        .code { font-size: 36px; font-weight: bold; letter-spacing: 4px; color: #d97706; font-family: monospace; }
        .warning { color: #d97706; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Your 2FA Code</h1>
        </div>
        <div class="content">
            <p>Hi {{ name }},</p>
            <p>Your two-factor authentication code is:</p>
            <div class="code-box">
                <div class="code">{{ otp_code }}</div>
                <p class="warning">⏱️ This code expires in 10 minutes</p>
            </div>
            <p><strong>Do NOT share this code with anyone.</strong></p>
            <p>If you didn't request this code, please log out immediately and change your password.</p>
        </div>
        <div class="footer">
            <p>&copy; 2024 Django Admin Pro. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
